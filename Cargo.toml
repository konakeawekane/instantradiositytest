[package]
name = "instantradiositytest"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
egui = "0.36.2"
egui-wgpu = { version = "0.36.2", default-features = false }
egui-winit = { version = "0.36.2", default-features = false, features = ["clipboard", "links"] }
glam = { version = "0.33", features = ["serde", "bytemuck"] }
half = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "vulkan", "wgsl"] }
winit = "0.30"

[dev-dependencies]
naga = { version = "30.0.0", features = ["wgsl-in", "spv-out"] }

[profile.release]
debug = 1
