[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "render-debug-tools"
version = "1.0.0"
description = "Deterministic, JSON-first image analysis for agentic rendering workflows."
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["Pillow>=9.0.1"]

[project.scripts]
render-debug = "render_debug.cli:main"

[tool.setuptools.packages.find]
include = ["render_debug*"]
